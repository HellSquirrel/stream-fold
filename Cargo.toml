[workspace]
resolver = "3"
members = [
    "crates/logfold-core",
    "crates/logfold-web",
    "crates/xtask",
    "examples/like-local",
    "examples/counter",
    "examples/like-button",
    "examples/brunhilda",
    "examples/studio",
    "examples/apps/*",
]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
