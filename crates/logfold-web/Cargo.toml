[package]
name = "logfold-web"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Browser host for the local like button: the log lives in WASM, the DOM is an output."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logfold-core = { path = "../logfold-core" }
like-local = { path = "../like-local" }
brunhilda = { path = "../brunhilda" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
