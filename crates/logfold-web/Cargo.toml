[package]
name = "logfold-web"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The generic browser host: a Component behind the boundary API, plus the macro that exports one as a wasm class."

[features]
default = ["bindgen"]
# The wasm-bindgen surface (`export_component!`). Off for raw apps: any crate
# that links wasm-bindgen gets its runtime exports whether it uses them or not.
bindgen = ["dep:wasm-bindgen"]

[dependencies]
logfold-core = { path = "../logfold-core" }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = { version = "4", default-features = false, features = ["lock_api"] }

[dev-dependencies]
like-local = { path = "../../examples/like-local" }
bench = { path = "../../examples/bench" }
counter = { path = "../../examples/counter" }
studio = { path = "../../examples/studio" }
