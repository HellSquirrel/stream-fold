<!doctype html>
<meta charset="utf-8">
<title>LogFold: Brunhilda</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
  canvas { display: block; border: 1px solid #ccc; image-rendering: pixelated; }
  button, select { font: inherit; padding: .35rem .7rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  .muted { color: #777; font-size: .9rem; }
  #status.attack { color: #b00; font-weight: bold; }
  input[type=range] { width: 100%; }
  kbd { border: 1px solid #bbb; border-radius: 3px; padding: 0 .3rem; font-size: .85em; }
</style>

<h1>Brunhilda</h1>
<p class="muted">You are the blue dot. <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move you, <kbd>space</kbd> stands still; each key is one frame. Or press <em>run</em> and try to get in her way.</p>

<div class="row">
  <label>policy <select id="policy"><option value="1">careful</option><option value="0">naive</option></select></label>
  <label><input id="dropout" type="checkbox"> sensor dropouts</label>
  <button id="new">new game</button>
  <button id="start">start</button>
  <button id="dockb">dock</button>
  <button id="estop">e-stop</button>
  <button id="run">run</button>
</div>

<canvas id="live" width="480" height="320"></canvas>
<p id="status"></p>

<h2>What she knew</h2>
<input id="scrub" type="range" min="0" max="0" value="0">
<p class="muted">index <span id="at">0</span> · <span id="prov"></span> · <span id="knew"></span></p>
<canvas id="past" width="480" height="320"></canvas>

<script type="module">
  import init, { VacuumApp } from "../pkg/logfold_web.js";
  await init();

  const $ = (id) => document.getElementById(id);
  const live = $("live").getContext("2d"), past = $("past").getContext("2d");
  const scrub = $("scrub");
  let app, timer = null, pendingDir = -1;
  const CELL = 40;

  function newGame() {
    if (timer) { clearInterval(timer); timer = null; $("run").textContent = "run"; }
    app = new VacuumApp($("policy").value === "1", 6, 6);
    scrub.dataset.follow = "true";
    render();
  }

  // ---- the host shim: every user action is one event or one frame ----
  function frame(dir) {
    const attacked = app.frame(dir, $("dropout").checked, 100);
    scrub.dataset.follow = "true";
    render();
    if (attacked) $("status").classList.add("attack"); else $("status").classList.remove("attack");
  }

  document.addEventListener("keydown", (e) => {
    const map = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, " ": -1 };
    if (!(e.key in map)) return;
    e.preventDefault();
    if (timer) pendingDir = map[e.key]; else frame(map[e.key]);
  });
  $("run").addEventListener("click", () => {
    if (timer) { clearInterval(timer); timer = null; $("run").textContent = "run"; return; }
    $("run").textContent = "pause";
    timer = setInterval(() => { frame(pendingDir); pendingDir = -1; }, 250);
  });
  $("new").addEventListener("click", newGame);
  $("start").addEventListener("click", () => { app.start(); render(); });
  $("dockb").addEventListener("click", () => { app.dock_cmd(); render(); });
  $("estop").addEventListener("click", () => { app.estop(); render(); });
  scrub.addEventListener("input", () => { scrub.dataset.follow = String(Number(scrub.value) === app.len()); renderPast(); });

  // ---- outputs: both canvases are functions of state; nothing is logged ----
  function drawRoom(ctx) {
    ctx.clearRect(0, 0, 480, 320);
    ctx.fillStyle = "#fafafa"; ctx.fillRect(0, 0, 480, 320);
    ctx.strokeStyle = "#eee";
    for (let x = 0; x <= app.width(); x++) { ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, 320); ctx.stroke(); }
    for (let y = 0; y <= app.height(); y++) { ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(480, y * CELL); ctx.stroke(); }
    const f = app.furniture();
    ctx.fillStyle = "#8d6e63";
    for (let i = 0; i < f.length; i += 2) ctx.fillRect(f[i] * CELL + 2, f[i + 1] * CELL + 2, CELL - 4, CELL - 4);
    const d = app.dock();
    ctx.strokeStyle = "#4a90e2"; ctx.lineWidth = 2; ctx.strokeRect(d[0] * CELL + 4, d[1] * CELL + 4, CELL - 8, CELL - 8); ctx.lineWidth = 1;
  }
  function drawCleaned(ctx, cells) {
    ctx.fillStyle = "rgba(76,175,80,.25)";
    for (let i = 0; i < cells.length; i += 2) ctx.fillRect(cells[i] * CELL, cells[i + 1] * CELL, CELL, CELL);
  }
  function drawHer(ctx, s) {
    const [x, y, heading, mode, , , , , attacking] = s;
    ctx.fillStyle = attacking ? "#d32f2f" : mode === 3 ? "#999" : "#333";
    ctx.beginPath(); ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, CELL * .36, 0, Math.PI * 2); ctx.fill();
    if (heading >= 0) {
      const [dx, dy] = [[0, -1], [1, 0], [0, 1], [-1, 0]][heading];
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(x * CELL + CELL / 2, y * CELL + CELL / 2);
      ctx.lineTo(x * CELL + CELL / 2 + dx * CELL * .3, y * CELL + CELL / 2 + dy * CELL * .3); ctx.stroke(); ctx.lineWidth = 1;
    }
  }
  function drawHuman(ctx, x, y, alpha) {
    ctx.fillStyle = `rgba(33,150,243,${alpha})`;
    ctx.beginPath(); ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, CELL * .3, 0, Math.PI * 2); ctx.fill();
  }

  function render() {
    const n = app.len();
    const s = app.snapshot(n), t = app.truth();
    drawRoom(live); drawCleaned(live, app.cleaned(n)); drawHer(live, s); drawHuman(live, t[0], t[1], 1);
    const modes = ["idle", "cleaning", "docking", "stopped"];
    $("status").textContent = `${modes[s[3]]} · cleaned ${s[7]} cells · bumps ${t[4]} · attacks ${t[2]}${t[3] ? " · motors latched" : ""} · ${n} events`;
    scrub.max = n;
    if (scrub.dataset.follow !== "false") scrub.value = n;
    renderPast();
  }
  function renderPast() {
    const n = Number(scrub.value);
    const s = app.snapshot(n);
    drawRoom(past); drawCleaned(past, app.cleaned(n)); drawHer(past, s);
    if (s[4] >= 0) drawHuman(past, s[4], s[5], Math.max(.15, 1 - s[6] * .25));
    $("at").textContent = n;
    const ck = app.checkpoint_for(n);
    $("prov").textContent = ck < 0 ? `folded ${n} events from 0` : `resumed from checkpoint at ${ck}, folded ${n - ck} more`;
    $("knew").textContent = s[4] < 0 ? "never seen you" : `last saw you at (${s[4]},${s[5]}) ${s[6]} tick(s) ago${s[8] ? " — ATTACK" : ""}`;
  }

  newGame();
</script>
