<!doctype html>
<meta charset="utf-8">
<title>LogFold: like</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
  button { font: inherit; padding: .5rem 1rem; }
  #like { font-size: 2rem; padding: .5rem 1.5rem; }
  #timeline { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 1rem; }
  #timeline span { display: inline-block; min-width: 2.2rem; text-align: center; padding: 2px 4px; border-radius: 3px; background: #eee; font-size: .8rem; }
  #timeline span.click { background: #ffd6d6; }
  #timeline span.past  { opacity: .35; }
  #timeline span.ckpt  { outline: 2px solid #4a90e2; }
  input[type=range] { width: 100%; }
  .muted { color: #777; font-size: .9rem; }
</style>

<h1>Like</h1>
<p><button id="like">♡</button> <button id="tick">tick</button></p>
<p>view: <code id="view"></code></p>

<h2>History</h2>
<input id="scrub" type="range" min="0" max="0" value="0">
<p class="muted">at index <span id="at">0</span>: <code id="view-at"></code> · <span id="prov"></span></p>
<div id="timeline"></div>

<script type="module">
  import init, { LikeApp } from "../pkg/logfold_web.js";
  await init();

  // ---- the host shim ----
  // Owns nothing but references to DOM nodes. All state is in `app`'s log.
  const app = new LikeApp();
  const $ = (id) => document.getElementById(id);
  const like = $("like"), view = $("view"), scrub = $("scrub");
  const at = $("at"), viewAt = $("view-at"), prov = $("prov"), timeline = $("timeline");

  // Output: the DOM is an idempotent function of the view. Diff and apply.
  function render() {
    const liked = app.liked();
    const label = liked ? "♥" : "♡";
    if (like.textContent !== label) like.textContent = label;
    view.textContent = JSON.stringify({ liked });

    const n = app.len();
    scrub.max = n;
    if (scrub.dataset.follow !== "false") scrub.value = n;
    renderScrub();
  }

  function renderScrub() {
    const n = Number(scrub.value);
    at.textContent = n;
    viewAt.textContent = JSON.stringify({ liked: app.liked_at(n) });
    const ck = app.checkpoint_for(n);
    prov.textContent = ck < 0
      ? `folded ${n} events from index 0`
      : `resumed from checkpoint at ${ck}, folded ${n - ck} more`;

    const total = app.len();
    const spans = [];
    for (let i = 0; i < total; i++) {
      const kind = app.kind(i);                       // a JS string handle, no copy
      const label = kind === "tick" ? `tick ${app.tick_ms(i).toFixed(0)}` : kind;
      const cls = [kind === "click" ? "click" : "", i >= n ? "past" : "", (i + 1) % 8 === 0 ? "ckpt" : ""].join(" ");
      spans.push(`<span class="${cls}" title="index ${i}">${i}·${label}</span>`);
    }
    timeline.innerHTML = spans.join("");
  }

  // Inputs: every user action becomes exactly one event.
  like.addEventListener("click", () => { app.click(); scrub.dataset.follow = "true"; render(); });
  $("tick").addEventListener("click", () => { app.tick(performance.now()); scrub.dataset.follow = "true"; render(); });
  scrub.addEventListener("input", () => { scrub.dataset.follow = String(Number(scrub.value) === app.len()); renderScrub(); });

  render();
</script>
